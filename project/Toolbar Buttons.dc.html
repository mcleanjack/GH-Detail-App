<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display: inline-flex; align-items: center; gap: 13px; border-radius: 3px; background: transparent; width: max-content">
  <sc-for list="{{ buttons }}" as="btn" hint-placeholder-count="4">
    <button type="button" onClick="{{ btn.onClick }}" title="{{ btn.label }}" aria-label="{{ btn.label }}" aria-pressed="{{ btn.pressed }}" disabled="{{ btn.disabled }}" style="{{ btn.style }}" style-hover="{{ btn.styleHover }}" style-active="{{ btn.styleActive }}"><span style="display:flex;align-items:center;justify-content:center;transform:rotate({{ btn.spin }});transition:transform 480ms cubic-bezier(.22,.61,.36,1)">{{ btn.icon }}</span></button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:90},&quot;activeTool&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;prev&quot;,&quot;next&quot;,&quot;cube&quot;,&quot;orbit&quot;,&quot;none&quot;],&quot;default&quot;:&quot;cube&quot;,&quot;tsType&quot;:&quot;'prev'|'next'|'cube'|'orbit'|'none'&quot;,&quot;section&quot;:&quot;Toolbar&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;touch&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm'|'md'|'lg'&quot;,&quot;section&quot;:&quot;Toolbar&quot;},&quot;disabledTools&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Toolbar&quot;},&quot;hiddenTools&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Toolbar&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
const svg = (c, s) => (children) => React.createElement('svg', {width: s, height: s, viewBox: '0 0 24 24', fill: 'none', stroke: c, strokeWidth: 1.15, strokeLinecap: 'round', strokeLinejoin: 'round'}, children);
const CHEV = 'M10.26 4.34 L17.92 12 L10.26 19.66 L8.14 17.54 L13.68 12 L8.14 6.46 Z';

const ICON = {
  prev: (c, s) => svg(c, s)(React.createElement('path', {key: 'p', d: CHEV, transform: 'translate(24,0) scale(-1,1)'})),
  next: (c, s) => svg(c, s)(React.createElement('path', {key: 'p', d: CHEV})),
  cube: (c, s) => svg(c, s)([
    React.createElement('path', {key: 'a', d: 'M12 2.6 20.9 7.3v9.4L12 21.4 3.1 16.7V7.3z'}),
    React.createElement('path', {key: 'b', d: 'M12 12 20.9 7.3M12 12 3.1 7.3M12 12v9.4'})
  ]),
  orbit: (c, s) => svg(c, s)([
    React.createElement('rect', {key: 'r', x: 3.1, y: 3.1, width: 17.8, height: 17.8, rx: 1.6})
  ])
};

// 'touch' keeps every button at the 44px minimum finger target.
const SIZES = {sm: {w: 36, h: 30, icon: 16}, md: {w: 44, h: 36, icon: 20}, touch: {w: 48, h: 44, icon: 22}, lg: {w: 62, h: 50, icon: 38}};

const TOOLS = [
  {id: 'prev', label: 'Previous stage', toggle: true},
  {id: 'next', label: 'Next stage', toggle: true},
  {id: 'cube', label: '3D / isometric view', toggle: true},
  {id: 'orbit', label: 'Orbit & pan tool', toggle: true}
];

class Component extends DCLogic {
  state = {active: null, flash: null};

  componentWillUnmount() { clearTimeout(this._flashT); }

  activeTool() {
    return this.state.active !== null ? this.state.active : (this.props.activeTool ?? 'cube');
  }

  renderVals() {
    const z = SIZES[this.props.size ?? 'md'] || SIZES.md;
    const active = this.activeTool();
    const disabledList = String(this.props.disabledTools ?? '').split(',').map(s => s.trim()).filter(Boolean);
    const onSelect = this.props.onSelect;

    const hiddenList = String(this.props.hiddenTools ?? '').split(',').map(s => s.trim()).filter(Boolean);
    const buttons = TOOLS.filter(t => hiddenList.indexOf(t.id) === -1).map((t, i) => {
      const flashed = this.state.flash === t.id;
      const on = (t.toggle && active === t.id) || flashed;
      const off = disabledList.indexOf(t.id) !== -1;
      const color = off ? '#6a6a69' : '#a9a8a7';
      return {
        label: t.label,
        pressed: t.toggle ? (on ? 'true' : 'false') : undefined,
        disabled: off || undefined,
        icon: ICON[t.id](color, z.icon),
        spin: '0deg',
        style: 'display: flex; align-items: center; justify-content: center; width: ' + z.w + 'px; height: ' + z.h + 'px; border: none; border-left: 0 none transparent; outline: none; padding: 0; transition: background 120ms ease; cursor: ' + (off ? 'default' : 'pointer')
          + '; border-radius: 4px'
          + '; transition: background 140ms ease, box-shadow 180ms ease, filter 180ms ease'
          + '; border-radius: 4px'
          + '; background: transparent'
          + '; box-shadow: none'
          + '; filter: ' + (on ? 'drop-shadow(0 0 2px rgba(255,255,255,.45)) drop-shadow(0 0 6px rgba(255,255,255,.2)) brightness(1.18)' : 'none'),
        styleHover: off ? 'background: transparent' : 'background: linear-gradient(128deg, #262625 0%, #2c2c2b 40%, #333332 100%); box-shadow: inset 0 2px 4px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.07)',
        styleActive: off ? 'background: transparent' : 'background: linear-gradient(128deg, #1f1f1e 0%, #262625 50%, #2e2e2d 100%); box-shadow: inset 0 3px 7px rgba(0,0,0,.7)',
        onClick: () => {
          if (off) return;
          if (t.toggle) this.setState({active: t.id});
          else {
            clearTimeout(this._flashT);
            this.setState({flash: t.id});
            this._flashT = setTimeout(() => this.setState({flash: null}), 220);
          }
          if (typeof onSelect === 'function') onSelect(t.id);
        }
      };
    });

    return {buttons: buttons};
  }
}
</script>
</body>
</html>
